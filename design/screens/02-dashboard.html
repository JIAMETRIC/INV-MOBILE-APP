<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <style>

/* ---------- Tokens ---------- */
:root {
  --primaryColor: #2596be;
  --secondaryColor: #666666;
  --tertiaryColor: #ebeaea;
  --darkColor: #000000;
  --lightColor: #ffffff;

  --primaryTint: rgba(37, 150, 190, 0.14);
  --primaryFill: rgba(37, 150, 190, 0.12);
  --linkColor: #1a6f8e;
  --focusRing: 0 0 0 3px rgba(37, 150, 190, 0.35);

  --glass: rgba(255, 255, 255, 0.55);
  --glassStrong: rgba(255, 255, 255, 0.6);
  --glassNav: rgba(255, 255, 255, 0.65);
  --glassBorder: rgba(255, 255, 255, 0.85);
  --glassBorderStrong: rgba(255, 255, 255, 0.9);
  --glassDark: rgba(255, 255, 255, 0.08);
  --glassDarkBorder: rgba(255, 255, 255, 0.16);
  --dividerDark: rgba(255, 255, 255, 0.18);

  --shadowPrimary: 0 4px 8px rgba(20, 71, 108, 0.15);
  --shadowSecondary: 0 8px 16px rgba(20, 71, 108, 0.2);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---------- Page (gallery of phones) ---------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  background: #d9d8d8;
  color: var(--darkColor);
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: none;
  box-shadow: var(--focusRing);
}
svg { display: block; }
[hidden] { display: none !important; }

.gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 40px;
  padding: 40px 16px;
}
.phone { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.phone-label { font-size: 14px; font-weight: 600; color: var(--secondaryColor); }

.screen {
  width: 390px;
  height: 844px;
  max-width: 100%;
  position: relative;
  overflow: hidden;
  border-radius: 44px;
  background: var(--tertiaryColor);
  color: var(--darkColor);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
}
.screen--dark { background: var(--darkColor); color: var(--lightColor); }

.screen-body {
  position: relative;
  height: 100%;
  padding: 56px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* On phones: each screen becomes full width, no frame */
@media (max-width: 440px) {
  .gallery { padding: 0; gap: 0; }
  .phone { width: 100%; gap: 0; }
  .phone-label { padding: 16px; align-self: flex-start; }
  .screen { width: 100%; border-radius: 0; box-shadow: none; }
}

/* ---------- Glass recipes ---------- */
.card {
  background: var(--glass);
  border: 1px solid var(--glassBorder);
  border-radius: 24px;
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: var(--shadowSecondary);
  padding: 16px;
}
.card--sm { box-shadow: var(--shadowPrimary); }
.card--list { padding: 8px 16px; }

.icon-btn {
  width: 44px; height: 44px;
  border-radius: 14px;
  background: var(--glassStrong);
  border: 1px solid var(--glassBorderStrong);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadowPrimary);
  color: var(--darkColor);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: background 0.18s var(--ease), transform 0.18s var(--ease);
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.8); }
.icon-btn:active { transform: scale(0.96); }
.icon-btn--round { border-radius: 50%; }

.btn-primary {
  height: 52px;
  border: 0;
  border-radius: 14px;
  background: var(--primaryColor);
  color: var(--lightColor);
  font-size: 16px;
  font-weight: 600;
  box-shadow: var(--shadowSecondary);
  transition: transform 0.18s var(--ease);
}
.btn-primary:active { transform: scale(0.98); }

/* ---------- Shared text styles ---------- */
.overline {
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--secondaryColor);
  display: flex; align-items: center; gap: 6px;
}
.muted { color: var(--secondaryColor); }
.row { display: flex; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: center; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.badge {
  font-size: 12px; font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--primaryTint);
}

/* ---------- Weather ---------- */
.location { gap: 6px; font-size: 16px; font-weight: 600; }
.hero { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
.hero-temp { font-size: 96px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; }
.hero-cond { font-size: 18px; font-weight: 500; margin-top: 6px; }
.hero-range { font-size: 14px; color: var(--secondaryColor); margin-top: 4px; }

.hours { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.hour {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 10px 0;
  border: 0; border-radius: 16px;
  background: transparent;
  color: var(--darkColor);
  transition: background 0.18s var(--ease), color 0.18s var(--ease);
}
.hour-time { font-size: 13px; color: var(--secondaryColor); }
.hour-temp { font-size: 15px; font-weight: 500; }
.hour.is-active { background: var(--primaryColor); color: var(--lightColor); box-shadow: var(--shadowPrimary); }
.hour.is-active .hour-time { color: var(--lightColor); font-weight: 600; }
.hour.is-active .hour-temp { font-weight: 600; }
.hour.is-active svg, .hour.is-active svg * { stroke: var(--lightColor); }

.tile { display: flex; flex-direction: column; gap: 6px; }
.tile-value { font-size: 28px; font-weight: 300; }
.tile-value small { font-size: 15px; font-weight: 500; }
.tile-note { font-size: 13px; color: var(--secondaryColor); }

.meter { height: 6px; border-radius: 999px; background: var(--tertiaryColor); position: relative; margin-top: 4px; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--primaryColor); }
.meter-thumb {
  position: absolute; top: -3px; width: 12px; height: 12px; margin-left: -6px;
  border-radius: 50%; background: var(--lightColor); box-shadow: 0 0 0 2px var(--primaryColor);
}

.day {
  display: grid; grid-template-columns: 56px 28px 1fr;
  align-items: center; gap: 12px;
  padding: 10px 0;
  font-size: 15px;
  border-bottom: 1px solid var(--tertiaryColor);
}
.day:last-child { border-bottom: 0; }
.day-name { font-weight: 500; }
.day-range { display: flex; align-items: center; gap: 10px; }
.day-lo { color: var(--secondaryColor); width: 28px; }
.day-hi { width: 28px; text-align: right; font-weight: 500; }
.range { flex-grow: 1; height: 5px; border-radius: 999px; background: var(--tertiaryColor); position: relative; }
.range-fill { position: absolute; top: 0; bottom: 0; border-radius: 999px; background: var(--primaryColor); }

/* ---------- Dashboard ---------- */
.screen-body--nav { padding-bottom: 112px; }
.greeting { display: flex; flex-direction: column; gap: 2px; }
.greeting-hi { font-size: 14px; color: var(--secondaryColor); }
.greeting-name { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.dot {
  position: absolute; top: 10px; right: 11px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--primaryColor); box-shadow: 0 0 0 2px var(--lightColor);
}
.avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--primaryColor); color: var(--lightColor);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 600;
  box-shadow: 0 0 0 2px var(--lightColor), var(--shadowPrimary);
}

.segmented {
  display: flex; padding: 4px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glassBorder);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadowPrimary);
}
.segmented button {
  flex: 1; height: 36px;
  border: 0; border-radius: 999px;
  background: transparent;
  color: var(--secondaryColor);
  font-size: 14px; font-weight: 500;
  transition: background 0.18s var(--ease), color 0.18s var(--ease);
}
.segmented button[aria-selected="true"] {
  background: var(--primaryColor); color: var(--lightColor);
  font-weight: 600; box-shadow: var(--shadowPrimary);
}

.revenue { padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.revenue-value { font-size: 40px; font-weight: 300; letter-spacing: -0.03em; }
.chart { width: 100%; height: 96px; margin-top: 4px; }
.chart-area, .chart-line { transition: d 0.4s var(--ease); }
.axis {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
  font-size: 11px; color: var(--secondaryColor); text-align: center;
}

.kpi { display: flex; flex-direction: column; gap: 10px; }
.chip {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--primaryTint);
  display: flex; align-items: center; justify-content: center;
}
.kpi-label { font-size: 13px; color: var(--secondaryColor); }
.kpi-value { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; }

.list-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--tertiaryColor); }
.list-row:last-child { border-bottom: 0; }
.list-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
  background: var(--primaryColor); color: var(--lightColor);
}
.list-avatar--alt { background: var(--tertiaryColor); color: var(--darkColor); }
.list-text { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
.list-title { font-size: 14px; font-weight: 500; }
.list-sub { font-size: 12px; color: var(--secondaryColor); }
.list-amount { font-size: 14px; font-weight: 600; }

.bottom-nav {
  position: absolute; left: 20px; right: 20px; bottom: 24px;
  height: 68px;
  border-radius: 24px;
  background: var(--glassNav);
  border: 1px solid var(--glassBorderStrong);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  box-shadow: var(--shadowSecondary);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  align-items: center; justify-items: center;
}
.nav-item {
  width: 48px; height: 48px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--secondaryColor);
  transition: background 0.18s var(--ease), color 0.18s var(--ease);
}
.nav-item[aria-current="page"] { background: var(--primaryColor); color: var(--lightColor); box-shadow: var(--shadowPrimary); }

/* ---------- Player ---------- */
.screen-body--player { padding: 56px 24px 32px; gap: 24px; }
.now-from { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.now-from-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--secondaryColor); }
.now-from-name { font-size: 14px; font-weight: 600; }

.album {
  align-self: center;
  width: 300px; height: 300px; max-width: 100%;
  border-radius: 32px; padding: 14px;
  background: rgba(255, 255, 255, 0.45);
  border: 1px solid var(--glassBorderStrong);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  box-shadow: var(--shadowSecondary);
}
.album-art { width: 100%; height: 100%; border-radius: 22px; position: relative; overflow: hidden; background: var(--primaryColor); }
.album-sun {
  position: absolute; width: 150px; height: 150px; border-radius: 50%;
  background: var(--lightColor); left: 50%; top: 60px; transform: translateX(-50%);
}
.album-strip {
  position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255, 255, 255, 0.6);
}

.track-title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.track-artist { font-size: 16px; color: var(--secondaryColor); }
.like { width: 48px; height: 48px; flex-shrink: 0; }
.like svg path { fill: transparent; stroke: var(--primaryColor); transition: fill 0.18s var(--ease); }
.like[aria-pressed="true"] svg path { fill: var(--primaryColor); }

.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-bar { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.8); position: relative; cursor: pointer; }
.progress-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--primaryColor); }
.progress-thumb {
  position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border-radius: 50%; background: var(--lightColor);
  box-shadow: 0 0 0 3px var(--primaryColor), var(--shadowPrimary);
}
.progress-times { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--secondaryColor); }

.controls { display: flex; justify-content: space-between; align-items: center; }
.ghost-btn {
  width: 44px; height: 44px; border: 0; background: transparent;
  color: var(--secondaryColor);
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
  transition: color 0.18s var(--ease);
}
.ghost-btn[aria-pressed="true"] { color: var(--primaryColor); }
.media-btn { width: 56px; height: 56px; }
.play-btn {
  width: 80px; height: 80px; border-radius: 50%; border: 0;
  background: var(--primaryColor); color: var(--lightColor);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadowSecondary);
  transition: transform 0.18s var(--ease);
}
.play-btn:active { transform: scale(0.96); }

.device {
  margin-top: auto;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 20px;
  background: var(--glass);
  border: 1px solid var(--glassBorder);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadowPrimary);
}
.device-name { flex-grow: 1; font-size: 14px; font-weight: 500; }

/* ---------- Sign in (dark) ---------- */
.screen-body--signin { padding: 88px 24px 32px; gap: 28px; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.logo {
  width: 64px; height: 64px; border-radius: 20px;
  background: var(--primaryColor); box-shadow: var(--shadowSecondary);
  display: flex; align-items: center; justify-content: center;
}
.brand h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.brand p { margin: 6px 0 0; font-size: 15px; color: var(--tertiaryColor); }

.form-card {
  border-radius: 28px; padding: 24px;
  background: var(--glassDark);
  border: 1px solid var(--glassDarkBorder);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  box-shadow: var(--shadowSecondary), inset 0 1px 0 rgba(255, 255, 255, 0.2);
  display: flex; flex-direction: column; gap: 16px;
}
.field { display: flex; flex-direction: column; gap: 8px; }
.field label, .field-label { font-size: 13px; font-weight: 500; color: var(--tertiaryColor); }
.field-head { display: flex; justify-content: space-between; align-items: baseline; }
.link { font-size: 13px; font-weight: 600; color: var(--lightColor); }
.link:hover { color: var(--tertiaryColor); }

.input {
  width: 100%; height: 50px;
  padding: 0 16px;
  border-radius: 14px;
  background: var(--glassDark);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--lightColor);
  font-size: 15px;
  outline: none;
  transition: border-color 0.18s var(--ease), box-shadow 0.18s var(--ease);
}
.input::placeholder { color: rgba(255, 255, 255, 0.6); }
.input:focus, .input:focus-visible { border-color: var(--primaryColor); box-shadow: var(--focusRing); }
.input--icon { padding-right: 48px; }
.input-wrap { position: relative; }
.eye {
  position: absolute; right: 3px; top: 3px;
  width: 44px; height: 44px; border: 0; background: transparent;
  color: var(--tertiaryColor);
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
}

.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; color: var(--tertiaryColor); cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--primaryColor); }

.form-msg { margin: 0; font-size: 13px; color: var(--tertiaryColor); text-align: center; }
.form-msg:empty { display: none; }

.divider { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--tertiaryColor); }
.divider::before, .divider::after { content: ""; flex-grow: 1; height: 1px; background: var(--dividerDark); }

.social {
  height: 50px;
  border-radius: 14px;
  border: 1px solid var(--glassDarkBorder);
  background: var(--glassDark);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: var(--shadowPrimary);
  color: var(--lightColor);
  font-size: 15px; font-weight: 500;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.18s var(--ease);
}
.social:hover { background: rgba(255, 255, 255, 0.14); }

.footer-note { margin: auto 0 0; text-align: center; font-size: 14px; color: var(--tertiaryColor); }
.footer-note a { color: var(--lightColor); font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}

  </style>
</head>
<body>
<main class="gallery">
  <section class="phone" aria-labelledby="lbl-dash">
    <h2 class="phone-label" id="lbl-dash">SaaS dashboard</h2>
    <div class="screen">
      <div class="screen-body screen-body--nav">
        <header class="between">
          <div class="greeting">
            <span class="greeting-hi">Good morning,</span>
            <span class="greeting-name">Alex</span>
          </div>
          <div class="row" style="gap:10px">
            <button class="icon-btn" aria-label="Notifications">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
              <span class="dot"></span>
            </button>
            <div class="avatar" aria-label="Alex's profile" role="img">A</div>
          </div>
        </header>

        <div class="segmented" role="tablist" aria-label="Range" id="rangeTabs">
          <button role="tab" aria-selected="false" data-range="day">Day</button>
          <button role="tab" aria-selected="true" data-range="week">Week</button>
          <button role="tab" aria-selected="false" data-range="month">Month</button>
        </div>

        <section class="card revenue" aria-label="Revenue">
          <div class="between">
            <span class="overline">Revenue</span>
            <span class="badge" id="revDelta">▲ 12.4%</span>
          </div>
          <div class="revenue-value" id="revValue">$48,290</div>
          <svg class="chart" role="img" aria-label="Revenue trend" viewBox="0 0 320 96" preserveAspectRatio="none">
            <path class="chart-area" id="chartArea" fill="#2596be" fill-opacity="0.12" d="M0 72 C30 70 40 56 70 58 S120 76 150 60 S200 30 230 38 S280 16 320 10 L320 96 L0 96 Z"/>
            <path class="chart-line" id="chartLine" fill="none" stroke="#2596be" stroke-width="2.4" stroke-linecap="round" d="M0 72 C30 70 40 56 70 58 S120 76 150 60 S200 30 230 38 S280 16 320 10"/>
          </svg>
          <div class="axis" id="chartAxis"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        </section>

        <div class="grid-2">
          <div class="card card--sm kpi">
            <div class="chip"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2596be" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></div>
            <div class="kpi-label">Active users</div>
            <div class="kpi-value" id="kpiUsers">3,812</div>
          </div>
          <div class="card card--sm kpi">
            <div class="chip"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2596be" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l6 6L21 6"/></svg></div>
            <div class="kpi-label">Conversion</div>
            <div class="kpi-value" id="kpiConv">4.7%</div>
          </div>
        </div>

        <section class="card card--list" aria-label="Recent activity">
          <div class="list-row"><div class="list-avatar">JM</div><div class="list-text"><span class="list-title">New Pro subscription</span><span class="list-sub">2 min ago</span></div><span class="list-amount">+$49</span></div>
          <div class="list-row"><div class="list-avatar list-avatar--alt">RK</div><div class="list-text"><span class="list-title">Team plan upgraded</span><span class="list-sub">1 hr ago</span></div><span class="list-amount">+$240</span></div>
        </section>
      </div>

      <nav class="bottom-nav" aria-label="Main" id="bottomNav">
        <a href="#" class="nav-item" aria-label="Home" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></a>
        <a href="#" class="nav-item" aria-label="Analytics"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg></a>
        <a href="#" class="nav-item" aria-label="Messages"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
        <a href="#" class="nav-item" aria-label="Settings"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
      </nav>
    </div>
  </section>
</main>
<script>
(function () {
  "use strict";

  /* ---------- Weather: select an hour ---------- */
  if (document.getElementById("hours")) {
  const hours = document.querySelectorAll("#hours .hour");
  const heroTemp = document.getElementById("heroTemp");
  const heroCond = document.getElementById("heroCond");

  hours.forEach((hour) => {
    hour.addEventListener("click", () => {
      hours.forEach((h) => {
        h.classList.remove("is-active");
        h.setAttribute("aria-pressed", "false");
      });
      hour.classList.add("is-active");
      hour.setAttribute("aria-pressed", "true");
      heroTemp.textContent = hour.dataset.temp + "°";
      heroCond.textContent = hour.dataset.cond;
    });
  });

  }

  /* ---------- Dashboard: Day / Week / Month ---------- */
  if (document.getElementById("rangeTabs")) {
  const ranges = {
    day: {
      value: "$6,920", delta: "▲ 3.1%", users: "1,204", conv: "5.2%",
      axis: ["6a", "9a", "12p", "3p", "6p", "9p", "12a"],
      points: [60, 64, 48, 40, 30, 36, 22],
    },
    week: {
      value: "$48,290", delta: "▲ 12.4%", users: "3,812", conv: "4.7%",
      axis: ["M", "T", "W", "T", "F", "S", "S"],
      points: [72, 58, 66, 60, 34, 38, 10],
    },
    month: {
      value: "$196,450", delta: "▲ 8.9%", users: "14,530", conv: "4.3%",
      axis: ["W1", "", "W2", "", "W3", "", "W4"],
      points: [80, 70, 74, 52, 46, 28, 18],
    },
  };

  // Smooth line through the points (Catmull-Rom → cubic Bézier), 320×96 viewBox
  function linePath(points) {
    const step = 320 / (points.length - 1);
    const p = points.map((y, i) => [i * step, y]);
    let d = `M${p[0][0]} ${p[0][1]}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i];
      const p1 = p[i];
      const p2 = p[i + 1];
      const p3 = p[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6;
      const c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6;
      const c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0]} ${p2[1]}`;
    }
    return d;
  }

  const tabs = document.querySelectorAll("#rangeTabs [role='tab']");
  const chartLine = document.getElementById("chartLine");
  const chartArea = document.getElementById("chartArea");
  const chartAxis = document.getElementById("chartAxis");

  function showRange(key) {
    const r = ranges[key];
    document.getElementById("revValue").textContent = r.value;
    document.getElementById("revDelta").textContent = r.delta;
    document.getElementById("kpiUsers").textContent = r.users;
    document.getElementById("kpiConv").textContent = r.conv;
    const d = linePath(r.points);
    chartLine.setAttribute("d", d);
    chartArea.setAttribute("d", d + " L320 96 L0 96 Z");
    chartAxis.innerHTML = r.axis.map((a) => `<span>${a}</span>`).join("");
  }

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach((t) => t.setAttribute("aria-selected", "false"));
      tab.setAttribute("aria-selected", "true");
      showRange(tab.dataset.range);
    });
  });
  showRange("week");

  /* ---------- Dashboard: bottom nav ---------- */
  const navItems = document.querySelectorAll("#bottomNav .nav-item");
  navItems.forEach((item) => {
    item.addEventListener("click", (e) => {
      e.preventDefault();
      navItems.forEach((n) => n.removeAttribute("aria-current"));
      item.setAttribute("aria-current", "page");
    });
  });

  }

  /* ---------- Player ---------- */
  if (document.getElementById("playBtn")) {
  const TOTAL = 224; // 3:44
  let position = 83; // 1:23
  let playing = true;
  let timer = null;

  const playBtn = document.getElementById("playBtn");
  const iconPlay = document.getElementById("iconPlay");
  const iconPause = document.getElementById("iconPause");
  const bar = document.getElementById("progressBar");
  const fill = document.getElementById("progressFill");
  const thumb = document.getElementById("progressThumb");
  const timeNow = document.getElementById("timeNow");

  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  function renderProgress() {
    const pct = (position / TOTAL) * 100;
    fill.style.width = pct + "%";
    thumb.style.left = pct + "%";
    timeNow.textContent = fmt(position);
    bar.setAttribute("aria-valuenow", String(Math.round(position)));
    bar.setAttribute("aria-valuetext", `${fmt(position)} of ${fmt(TOTAL)}`);
  }

  function setPlaying(next) {
    playing = next;
    iconPause.hidden = !playing;
    iconPlay.hidden = playing;
    playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    clearInterval(timer);
    if (playing) {
      timer = setInterval(() => {
        position = position >= TOTAL ? 0 : position + 1;
        renderProgress();
      }, 1000);
    }
  }

  playBtn.addEventListener("click", () => setPlaying(!playing));
  document.getElementById("prevBtn").addEventListener("click", () => { position = 0; renderProgress(); });
  document.getElementById("nextBtn").addEventListener("click", () => { position = 0; renderProgress(); });

  bar.addEventListener("click", (e) => {
    const rect = bar.getBoundingClientRect();
    position = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * TOTAL;
    renderProgress();
  });
  bar.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") position = Math.min(TOTAL, position + 5);
    else if (e.key === "ArrowLeft") position = Math.max(0, position - 5);
    else return;
    e.preventDefault();
    renderProgress();
  });

  function togglePressed(id, labelOn, labelOff) {
    const btn = document.getElementById(id);
    btn.addEventListener("click", () => {
      const on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", String(on));
      if (labelOn) btn.setAttribute("aria-label", on ? labelOn : labelOff);
    });
  }
  togglePressed("likeBtn", "Remove from liked songs", "Add to liked songs");
  togglePressed("shuffleBtn");
  togglePressed("repeatBtn");
  document.getElementById("likeBtn").setAttribute("aria-label", "Remove from liked songs");

  renderProgress();
  setPlaying(true);

  }

  /* ---------- Sign in ---------- */
  if (document.getElementById("signinForm")) {
  const eyeBtn = document.getElementById("eyeBtn");
  const pwd = document.getElementById("password");
  eyeBtn.addEventListener("click", () => {
    const show = pwd.type === "password";
    pwd.type = show ? "text" : "password";
    eyeBtn.setAttribute("aria-pressed", String(show));
    eyeBtn.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  document.getElementById("signinForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const msg = document.getElementById("formMsg");
    if (!/^\S+@\S+\.\S+$/.test(email)) msg.textContent = "Enter a valid email address.";
    else if (!pwd.value) { msg.textContent = "Enter your password."; pwd.focus(); }
    else msg.textContent = "Signing in…";
  });
  }
})();

</script>
</body>
</html>
